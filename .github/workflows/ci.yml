name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: the tests run the .ts sources directly, which needs both
      # unflagged type stripping and module.registerHooks for the resolver
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # the build is the only step that catches a broken page or bad import
      - run: npm run build
