<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070808"/>
      <stop offset="1" stop-color="#0b0f0c"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cff6b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eaffea" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7cff6b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- skyline -->
  <g fill="#101312">
    <rect x="60" y="230" width="70" height="90"/><rect x="150" y="200" width="46" height="120"/>
    <rect x="220" y="250" width="90" height="70"/><rect x="330" y="180" width="40" height="140"/>
    <rect x="900" y="210" width="66" height="110"/><rect x="990" y="240" width="100" height="80"/>
    <rect x="1110" y="190" width="48" height="130"/><rect x="1180" y="250" width="70" height="70"/>
  </g>
  <g fill="#7cff6b" opacity="0.35">
    <rect x="166" y="216" width="6" height="6"/><rect x="342" y="196" width="6" height="6"/>
    <rect x="1122" y="206" width="6" height="6"/><rect x="1008" y="252" width="6" height="6"/>
  </g>
  <!-- perspective grid -->
  <g stroke="#7cff6b" stroke-opacity="0.28" stroke-width="1.2">
    <line x1="640" y1="320" x2="-260" y2="720"/><line x1="640" y1="320" x2="20" y2="720"/>
    <line x1="640" y1="320" x2="240" y2="720"/><line x1="640" y1="320" x2="420" y2="720"/>
    <line x1="640" y1="320" x2="580" y2="720"/><line x1="640" y1="320" x2="700" y2="720"/>
    <line x1="640" y1="320" x2="860" y2="720"/><line x1="640" y1="320" x2="1040" y2="720"/>
    <line x1="640" y1="320" x2="1260" y2="720"/><line x1="640" y1="320" x2="1540" y2="720"/>
  </g>
  <g stroke="#7cff6b" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="330" x2="1280" y2="330"/><line x1="0" y1="348" x2="1280" y2="348"/>
    <line x1="0" y1="374" x2="1280" y2="374"/><line x1="0" y1="412" x2="1280" y2="412"/>
    <line x1="0" y1="466" x2="1280" y2="466"/><line x1="0" y1="542" x2="1280" y2="542"/>
    <line x1="0" y1="644" x2="1280" y2="644"/>
  </g>
  <line x1="0" y1="320" x2="1280" y2="320" stroke="#7cff6b" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- train streak with rgb fringe -->
  <rect x="140" y="296" width="1000" height="3" fill="#ff4d4d" opacity="0.5"/>
  <rect x="150" y="304" width="1000" height="3" fill="#4dc9ff" opacity="0.5"/>
  <rect x="145" y="299" width="1000" height="6" fill="url(#streak)"/>
  <!-- hud text -->
  <text x="56" y="84" fill="#7cff6b" font-size="22" letter-spacing="6">LAST TRAIN 00:47</text>
  <text x="56" y="112" fill="#6b6b6b" font-size="16" letter-spacing="4">終電 — 環状線 / PLATFORM 09</text>
  <text x="1224" y="668" fill="#6b6b6b" font-size="14" letter-spacing="4" text-anchor="end">REC ● 00:12:47:18</text>
  <rect x="0.75" y="0.75" width="1278.5" height="718.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <rect width="1280" height="720" fill="url(#vign)"/>
</svg>
