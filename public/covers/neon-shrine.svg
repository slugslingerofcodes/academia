<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, monospace">
  <defs>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cff6b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7cff6b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vign6" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0a0a0c"/>
  <!-- moon -->
  <circle cx="1030" cy="150" r="58" fill="none" stroke="#e8e8e8" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="1030" cy="150" r="58" fill="#e8e8e8" opacity="0.06"/>
  <!-- stars -->
  <g fill="#e8e8e8" opacity="0.45">
    <circle cx="150" cy="110" r="1.3"/><circle cx="420" cy="70" r="1.1"/><circle cx="760" cy="120" r="1.3"/>
    <circle cx="1200" cy="300" r="1"/><circle cx="90" cy="300" r="1"/><circle cx="620" cy="180" r="1"/>
  </g>
  <!-- torii gate, neon -->
  <g stroke="#7cff6b" stroke-width="5" fill="none" filter="url(#glow)">
    <path d="M400 190 Q640 158 880 190"/>
    <line x1="430" y1="196" x2="424" y2="252"/><line x1="850" y1="196" x2="856" y2="252"/>
    <line x1="470" y1="256" x2="810" y2="256"/>
    <line x1="488" y1="256" x2="470" y2="560"/><line x1="792" y1="256" x2="810" y2="560"/>
    <line x1="640" y1="200" x2="640" y2="256"/>
  </g>
  <!-- ground line + reflection -->
  <line x1="240" y1="560" x2="1040" y2="560" stroke="#e8e8e8" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="400" y="560" width="480" height="120" fill="url(#refl)"/>
  <!-- ar frame corners -->
  <g stroke="#e8e8e8" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M100 160v-40h40"/><path d="M1180 160v-40h-40"/>
    <path d="M100 600v40h40"/><path d="M1180 600v40h-40"/>
  </g>
  <text x="640" y="632" fill="#6b6b6b" font-size="16" letter-spacing="10" text-anchor="middle">ネオン神社 — スキャン中</text>
  <text x="56" y="84" fill="#7cff6b" font-size="22" letter-spacing="6">NEON SHRINE — AR LINK OK</text>
  <text x="56" y="112" fill="#6b6b6b" font-size="16" letter-spacing="4">夜の神社 / CHARM NO.13 DETECTED</text>
  <rect x="0.75" y="0.75" width="1278.5" height="718.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <rect width="1280" height="720" fill="url(#vign6)"/>
</svg>
